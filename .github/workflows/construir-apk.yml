name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  actions: read
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar carpetas
        run: |
          mkdir -p www assets
          cp index.html www/
          cp icon-*.png splash*.png assets/
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Agregar el widget Mi plata - Hoy
        run: python3 agregar_widget.py
      - name: Permisos de notificaciones
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $F || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $F
          grep -q RECEIVE_BOOT_COMPLETED $F || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' $F
      - name: Numerar la version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Fijar la misma clave de firma en el proyecto Android
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore android/app/debug.keystore
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          assert "android {" in s and "    buildTypes {" in s
          s = s.replace(
              "android {",
              """android {
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          """,
              1,
          )
          s = s.replace(
              "    buildTypes {",
              "    buildTypes {\n        debug { signingConfig signingConfigs.debug }",
              1,
          )
          p.write_text(s)
          PY
      - name: Construir APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/download-artifact@v4
        with:
          name: mi-plata-APK
          path: apk-instalado
          run-id: 40521469833
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verificar paquete, versión y firma
        env:
          EXPECTED_RUN: ${{ github.run_number }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          INSTALLED_APK=apk-instalado/app-debug.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          AAPT="$TOOLS/aapt"
          APKSIGNER="$TOOLS/apksigner"
          test -f "$INSTALLED_APK"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.bustos.miplata' versionCode='$EXPECTED_RUN' versionName='1.0.$EXPECTED_RUN'"
          NEW_SHA=$("$APKSIGNER" verify --print-certs "$APK" | awk '{line=tolower($0); if (line ~ /certificate sha-256 digest:/) {sub(/.*digest:[[:space:]]*/, "", line); gsub(/:/, "", line); print line; exit}}')
          OLD_SHA=$("$APKSIGNER" verify --print-certs "$INSTALLED_APK" | awk '{line=tolower($0); if (line ~ /certificate sha-256 digest:/) {sub(/.*digest:[[:space:]]*/, "", line); gsub(/:/, "", line); print line; exit}}')
          KEY_SHA=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '{line=tolower($0); if (line ~ /sha-?256:/) {sub(/.*sha-?256:[[:space:]]*/, "", line); gsub(/:/, "", line); gsub(/[[:space:]]/, "", line); print line; exit}}')
          echo "Huella APK nuevo: $NEW_SHA"
          echo "Huella clave fija: $KEY_SHA"
          echo "Huella APK instalado 1.0.37: $OLD_SHA"
          test -n "$NEW_SHA"
          test -n "$OLD_SHA"
          test -n "$KEY_SHA"
          test "$NEW_SHA" = "$KEY_SHA"
          if [ "$NEW_SHA" != "$OLD_SHA" ]; then
            echo "::warning::La app instalada requiere una reinstalación única para adoptar la clave fija; conservá y restaurá la copia de seguridad."
          else
            echo "APK compatible para actualizar sin desinstalar."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mi-plata-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
