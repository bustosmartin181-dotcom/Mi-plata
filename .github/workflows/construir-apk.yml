name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar carpetas
        run: |
          mkdir -p www assets
          cp index.html www/
          cp icon-*.png splash*.png assets/
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Agregar el widget Mi plata - Hoy
        run: python3 agregar_widget.py
      - name: Permisos de notificaciones
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $F || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $F
          grep -q RECEIVE_BOOT_COMPLETED $F || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' $F
      - name: Numerar la version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Usar siempre la misma clave de firma
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Construir APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Verificar compatibilidad de actualización
        env:
          EXPECTED_RUN: ${{ github.run_number }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          AAPT="$TOOLS/aapt"
          APKSIGNER="$TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.bustos.miplata' versionCode='$EXPECTED_RUN' versionName='1.0.$EXPECTED_RUN'"
          KEY_SHA=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$KEY_SHA"
          test -n "$APK_SHA"
          test "$APK_SHA" = "$KEY_SHA"
          echo "APK verificado: aplicación, versión y firma correctas."
      - uses: actions/upload-artifact@v4
        with:
          name: mi-plata-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
