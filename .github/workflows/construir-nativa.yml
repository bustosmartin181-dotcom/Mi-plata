name: Construir Mi Plata nativa

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/construir-nativa.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compilar vista previa nativa
        working-directory: android-native
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mi-plata-nativa-preview
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
